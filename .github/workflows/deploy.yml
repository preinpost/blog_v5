name: Deploy to Cloudflare Workers

on:
  # main 에 푸시되면 자동 배포
  push:
    branches: [main]
  # Actions 탭에서 수동으로도 실행 가능 (Run workflow 버튼)
  workflow_dispatch:

# 배포가 겹치지 않도록 직렬화. 진행 중인 배포는 취소하지 않음
# (마이그레이션이 중간에 끊기는 것을 방지)
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # GitHub > Settings > Secrets and variables > Actions 에 등록 필요
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 새 코드가 기대하는 스키마를 먼저 보장 (배포 전 마이그레이션)
      - name: Apply remote D1 migrations
        run: pnpm db:migrate:remote

      - name: Build & Deploy
        run: pnpm run deploy

      - name: Write deploy summary
        if: always()
        run: |
          {
            echo "## Cloudflare 배포"
            echo ""
            echo "- 결과: ${{ job.status }}"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo "- 시각(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- 트리거: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
